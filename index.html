<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matrículas · Colégio Adventista de Paulínia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f2a4a;
    --blue:#1e4976;
    --blue-light:#e8f0f9;
    --gold:#f0b429;
    --gold-dark:#c98f10;
    --cream:#f7f5f0;
    --ink:#233240;
    --slate:#5c6b7a;
    --line:#e3ddd0;
    --green:#2d9d6f;
    --green-light:#e6f6ef;
    --red:#c0392b;
    --red-light:#fbeae8;
    --white:#ffffff;
    --radius:14px;
    --shadow:0 1px 2px rgba(15,42,74,.06), 0 8px 24px rgba(15,42,74,.06);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Manrope',sans-serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  button{font-family:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#d8d1c0;border-radius:8px;}

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    background:
      radial-gradient(circle at 15% 15%, rgba(240,180,41,.14), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(30,73,118,.12), transparent 45%),
      var(--cream);
  }
  .login-card{
    width:100%;
    max-width:480px;
    background:var(--white);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:40px 36px 32px;
    border:1px solid var(--line);
  }
  .brand-mark{
    width:52px;height:52px;border-radius:12px;
    background:linear-gradient(155deg,var(--navy),var(--blue));
    color:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:600;font-size:26px;
    margin-bottom:18px;
  }
  .login-card h1{font-size:26px;font-weight:600;margin:0 0 4px;color:var(--navy);line-height:1.25;}
  .login-card p.sub{margin:0 0 26px;color:var(--slate);font-size:14.5px;}
  #user-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .user-btn{
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    padding:13px 14px;border-radius:11px;border:1.5px solid var(--line);
    background:var(--white);cursor:pointer;text-align:left;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .user-btn:hover{border-color:var(--gold);background:#fffbf0;}
  .user-btn:active{transform:scale(.98);}
  .user-btn .nm{font-weight:700;font-size:15px;color:var(--navy);}
  .user-btn .rl{font-size:12px;color:var(--slate);}
  .user-btn.diretor{grid-column:1/-1;background:var(--blue-light);}
  .login-footer{margin-top:24px;font-size:11.5px;color:#94a1ad;text-align:center;}

  /* ---------- APP SHELL ---------- */
  #app{display:none;min-height:100vh;}
  .shell{display:flex;min-height:100vh;}
  nav.sidebar{
    width:236px;flex-shrink:0;background:var(--navy);color:#cfe0f2;
    display:flex;flex-direction:column;padding:22px 16px;
    position:sticky;top:0;height:100vh;
  }
  .side-brand{display:flex;align-items:center;gap:10px;padding:0 6px 22px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:18px;}
  .side-brand .mk{width:34px;height:34px;border-radius:9px;background:rgba(240,180,41,.15);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;}
  .side-brand div{font-size:13px;line-height:1.25;font-weight:700;color:#fff;}
  .side-brand span{display:block;font-weight:500;color:#9db3c8;font-size:11px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
    color:#cfe0f2;text-decoration:none;font-size:14.5px;font-weight:600;cursor:pointer;
    margin-bottom:3px;border:none;background:transparent;width:100%;text-align:left;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:var(--gold);color:var(--navy);}
  .nav-item .ico{width:18px;text-align:center;font-size:15px;}
  .sidebar-spacer{flex:1;}
  .side-user{border-top:1px solid rgba(255,255,255,.1);padding-top:14px;}
  .side-user .who{font-size:13.5px;font-weight:700;color:#fff;}
  .side-user .role{font-size:11.5px;color:#9db3c8;margin-bottom:10px;}
  .switch-btn{font-size:12.5px;color:#9db3c8;background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;display:block;margin-bottom:6px;}

  main.content{flex:1;padding:30px 36px 60px;max-width:1180px;}
  .topline{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:14px;}
  .topline h1{font-size:26px;margin:0;color:var(--navy);font-weight:600;}
  .topline p{margin:4px 0 0;color:var(--slate);font-size:14px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;border:none;border-radius:10px;
    padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;
    transition:transform .1s, box-shadow .15s;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--gold);color:var(--navy);}
  .btn-primary:hover{box-shadow:0 4px 14px rgba(240,180,41,.4);}
  .btn-ghost{background:var(--white);color:var(--navy);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--blue);}
  .btn-danger{background:var(--red-light);color:var(--red);}
  .btn-danger:hover{background:#f6d7d3;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* dashboard cards */
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:26px;}
  .stat-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
  .stat-card .num{font-family:'Fraunces',serif;font-size:32px;font-weight:600;color:var(--navy);}
  .stat-card .lbl{font-size:12.5px;color:var(--slate);font-weight:600;}

  .grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:start;}
  @media (max-width:920px){.grid-2{grid-template-columns:1fr;}}

  .panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;}
  .panel h2{font-size:16.5px;margin:0 0 16px;color:var(--navy);font-weight:600;}

  .mat-row{
    display:flex;align-items:center;gap:14px;padding:13px 8px;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap;
  }
  .mat-row:last-child{border-bottom:none;}
  .mat-row:hover{background:#faf8f3;}
  .mat-row .avatar{width:38px;height:38px;border-radius:50%;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;}
  .mat-row .info{flex:1;min-width:0;}
  .mat-row .name{font-weight:700;font-size:14.5px;color:var(--ink);}
  .mat-row .step{font-size:12.5px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .progress-track{width:90px;height:6px;border-radius:4px;background:var(--line);overflow:hidden;flex-shrink:0;}
  .progress-fill{height:100%;background:var(--gold);border-radius:4px;}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;flex-shrink:0;}
  .badge.andamento{background:var(--blue-light);color:var(--blue);}
  .badge.finalizada{background:var(--green-light);color:var(--green);}

  .empty{padding:30px 10px;text-align:center;color:var(--slate);font-size:13.5px;}

  /* pie chart legend */
  .legend{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .legend-item{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink);}
  .legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .legend-item .cnt{margin-left:auto;font-weight:700;color:var(--navy);}

  /* forms */
  .form-card{max-width:480px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px;}
  .field input, .field select{
    width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;
    font-family:inherit;color:var(--ink);background:var(--white);
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--gold);}
  .hint{font-size:12px;color:var(--slate);margin-top:6px;}
  .checkline{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;color:var(--ink);}
  .checkline input{width:auto;}

  /* detail / checklist */
  .detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
  .detail-header .aluno-nome{font-size:24px;font-weight:600;color:var(--navy);margin:0 0 4px;}
  .detail-header .meta{font-size:13px;color:var(--slate);}
  .checklist{display:flex;flex-direction:column;}
  .step-row{
    display:flex;align-items:flex-start;gap:14px;padding:16px 6px;border-bottom:1px solid var(--line);
  }
  .step-row:last-child{border-bottom:none;}
  .step-check{
    width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;margin-top:2px;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;
    background:var(--white);cursor:default;transition:all .15s;
  }
  .step-check.done{background:var(--green);border-color:var(--green);color:#fff;}
  .step-check.ready{border-color:var(--gold);cursor:pointer;}
  .step-check.ready:hover{background:#fff8e6;}
  .step-body{flex:1;}
  .step-title{font-weight:700;font-size:14.5px;color:var(--ink);}
  .step-title.done{color:var(--slate);}
  .step-role{font-size:11.5px;font-weight:700;color:var(--blue);background:var(--blue-light);padding:2px 8px;border-radius:20px;display:inline-block;margin-top:4px;}
  .step-log{font-size:12px;color:var(--green);margin-top:5px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .step-undo{font-size:11.5px;color:var(--red);background:none;border:none;cursor:pointer;text-decoration:underline;font-weight:700;padding:0;}
  .step-cta{margin-top:9px;}
  .step-cta button{
    background:var(--gold);color:var(--navy);border:none;border-radius:8px;padding:8px 14px;
    font-size:13px;font-weight:700;cursor:pointer;
  }
  .step-cta button:hover{box-shadow:0 3px 10px rgba(240,180,41,.4);}

  .archive-search{display:flex;gap:10px;margin-bottom:18px;}
  .archive-search input{
    flex:1;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;
  }
  .archive-search input:focus{outline:none;border-color:var(--gold);}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:999;
    max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .modal-bg{position:fixed;inset:0;background:rgba(15,42,74,.45);display:none;align-items:center;justify-content:center;z-index:998;padding:20px;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--white);border-radius:16px;padding:26px;max-width:380px;width:100%;box-shadow:var(--shadow);}
  .modal h3{margin:0 0 8px;color:var(--navy);font-size:17px;}
  .modal p{margin:0 0 20px;color:var(--slate);font-size:14px;line-height:1.5;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;}

  .viewonly-banner{background:var(--blue-light);color:var(--blue);font-size:12.5px;font-weight:700;padding:10px 14px;border-radius:10px;margin-bottom:20px;}

  /* usuários */
  .user-row-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .user-row-actions .btn{padding:7px 12px;font-size:12.5px;}
  .edit-grid{flex:1 1 100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  @media (max-width:600px){.edit-grid{grid-template-columns:1fr;}}

  @media (max-width:760px){
    .shell{flex-direction:column;}
    nav.sidebar{
      width:100%;height:auto;position:sticky;top:0;flex-direction:row;align-items:center;
      padding:12px 14px;z-index:50;overflow-x:auto;
    }
    .side-brand{display:none;}
    .sidebar-spacer{display:none;}
    .side-user{display:none;}
    .nav-item{white-space:nowrap;margin-bottom:0;}
    main.content{padding:20px 16px 50px;}
    #user-list{grid-template-columns:1fr;}
    .grid-2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen">
  <div class="login-card">
    <div class="brand-mark">A</div>
    <h1>Matrículas · Colégio Adventista de Paulínia</h1>
    <p class="sub" id="login-sub">Selecione seu nome para entrar no painel de acompanhamento.</p>
    <div id="user-list"></div>
    <div class="login-footer">Acompanhamento interno de novas matrículas</div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <div class="shell">
    <nav class="sidebar">
      <div class="side-brand">
        <div class="mk">A</div>
        <div>Colégio Adventista<span>de Paulínia</span></div>
      </div>
      <button class="nav-item active" data-view="dashboard"><span class="ico">◆</span> Painel</button>
      <button class="nav-item" data-view="nova" id="nav-nova"><span class="ico">＋</span> Nova matrícula</button>
      <button class="nav-item" data-view="arquivo"><span class="ico">▤</span> Arquivo</button>
      <button class="nav-item" data-view="usuarios" id="nav-usuarios" style="display:none;"><span class="ico">☺</span> Usuários</button>
      <div class="sidebar-spacer"></div>
      <div class="side-user">
        <div class="who" id="side-who">—</div>
        <div class="role" id="side-role">—</div>
        <button class="switch-btn" id="minha-senha">Alterar minha senha</button>
        <button class="switch-btn" id="switch-user">Trocar usuário</button>
      </div>
    </nav>

    <main class="content" id="content"></main>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3 id="modal-title">Confirmar ação?</h3>
    <p id="modal-text">Essa ação não pode ser desfeita.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modal-cancel">Cancelar</button>
      <button class="btn btn-danger" id="modal-confirm">Confirmar</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc,
  serverTimestamp, query, orderBy, getDocs
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from './firebase-config.js';

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const matriculasRef = collection(db, "matriculas");
const usuariosRef = collection(db, "usuarios");

// ---------------------------------------------------------------
// DADOS FIXOS
// ---------------------------------------------------------------
const ETAPAS = [
  { id:1,  nome:"Matrícula Nova", resp:"Gestora" },
  { id:2,  nome:"Pagamento recebido", resp:"Gestora" },
  { id:3,  nome:"Documentos básicos recebidos (RG e CPF dos responsáveis e do aluno)", resp:"Gestora" },
  { id:4,  nome:"Entrega da Ficha de Saúde", resp:"Gestora" },
  { id:5,  nome:"Entrega do Formulário de Boas-vindas", resp:"Gestora" },
  { id:6,  nome:"Cadastrar aluno e gerar matrícula no 7Edu", resp:"Secretaria" },
  { id:7,  nome:"Baixar pagamento", resp:"Tesouraria" },
  { id:8,  nome:"Aceite", resp:"Secretaria" },
  { id:9,  nome:"Documentos complementares", resp:"Secretaria" },
  { id:10, nome:"Matrícula finalizada – Prontuário", resp:"Secretaria" },
];

const USUARIOS_PADRAO = [
  { nome:"Alexandre", papel:"Diretor", nivel:"consulta", excluir:false, admin:false },
  { nome:"Alice", papel:"Secretaria", nivel:"total", excluir:false, admin:false },
  { nome:"Daniel", papel:"Tesouraria", nivel:"total", excluir:true, admin:true },
  { nome:"Heloisa", papel:"Secretaria", nivel:"total", excluir:false, admin:false },
  { nome:"Jessika", papel:"Secretaria", nivel:"total", excluir:false, admin:false },
  { nome:"Keroli", papel:"Secretaria", nivel:"total", excluir:false, admin:false },
  { nome:"Magali", papel:"Secretaria", nivel:"total", excluir:false, admin:false },
  { nome:"Mayara", papel:"Gestora de Relacionamento", nivel:"total", excluir:true, admin:false },
];

const PIE_COLORS = ["#1e4976","#f0b429","#2d9d6f","#c0392b","#7a5cc9","#0f2a4a","#d98a3d","#3d9ab5","#a3475f","#6b7f2e"];

// ---------------------------------------------------------------
// ESTADO
// ---------------------------------------------------------------
let USERS = [];
let usersLoaded = false;
let tentouAutoLogin = false;
let currentUser = null;
let currentView = "dashboard";
let matriculas = [];
let openMatriculaId = null;
let pendingAction = null; // { tipo, id }

// login em duas etapas (nome -> senha)
let loginStage = 'nome'; // 'nome' | 'senha' | 'criar'
let selectedLoginUser = null;

// painel de usuários
let editingUserId = null;
let addingUser = false;

function fmtData(ts){
  if(!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('pt-BR') + " às " + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function iniciais(nome){
  return nome.split(" ").filter(Boolean).slice(0,2).map(p=>p[0]).join("").toUpperCase();
}
function etapaAtualIndex(mat){
  return mat.etapas.findIndex(e=>!e.concluida);
}
function ultimoDoneIndex(mat){
  let last = -1;
  for(let i=0;i<mat.etapas.length;i++){
    if(mat.etapas[i].concluida) last = i; else break;
  }
  return last;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}

// ---------------------------------------------------------------
// SENHAS (hash com salt individual, via Web Crypto)
// ---------------------------------------------------------------
function gerarSalt(){
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashSenha(senha, salt){
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest('SHA-256', enc.encode(salt + ":" + senha));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ---------------------------------------------------------------
// USUÁRIOS — CARGA INICIAL / SEMENTE
// ---------------------------------------------------------------
async function seedUsuariosSeNecessario(){
  try{
    const snap = await getDocs(usuariosRef);
    if(snap.empty){
      for(const u of USUARIOS_PADRAO){
        await addDoc(usuariosRef, { ...u, ativo:true, senhaHash:null, senhaSalt:null });
      }
    }
  }catch(e){ console.error("Falha ao criar usuários padrão:", e); }
}

onSnapshot(usuariosRef, snap=>{
  USERS = snap.docs.map(d=>({ _id:d.id, ...d.data() }));
  usersLoaded = true;

  if(currentUser){
    const atualizado = USERS.find(u=>u._id===currentUser._id);
    if(atualizado){
      currentUser = atualizado;
      atualizarSidebar();
      render();
    } else {
      // o usuário logado foi removido por um administrador
      localStorage.removeItem('matriculas_user');
      location.reload();
    }
    return;
  }

  if(!tentouAutoLogin){
    tentouAutoLogin = true;
    const savedName = localStorage.getItem('matriculas_user');
    if(savedName){
      const u = USERS.find(x=>x.nome===savedName && x.ativo!==false);
      if(u){ login(u); return; }
      localStorage.removeItem('matriculas_user');
    }
  }
  renderLoginScreen();
}, err=>{
  console.error(err);
  document.getElementById('login-sub').textContent = 'Não foi possível conectar ao banco de dados. Confira o firebase-config.js e as regras do Firestore.';
});

// ---------------------------------------------------------------
// LOGIN
// ---------------------------------------------------------------
function renderLoginScreen(){
  const list = document.getElementById('user-list');
  const sub = document.getElementById('login-sub');
  if(!usersLoaded){
    list.innerHTML = `<div class="empty" style="grid-column:1/-1;">Carregando...</div>`;
    return;
  }
  if(loginStage==='senha' || loginStage==='criar'){
    sub.textContent = loginStage==='criar' ? 'Primeiro acesso — crie sua senha' : 'Digite sua senha para entrar';
    renderLoginPasswordForm();
    return;
  }
  sub.textContent = 'Selecione seu nome para entrar no painel de acompanhamento.';
  list.innerHTML = "";
  const ativos = USERS.filter(u=>u.ativo!==false).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  if(ativos.length===0){
    list.innerHTML = `<div class="empty" style="grid-column:1/-1;">Nenhum usuário cadastrado ainda.</div>`;
    return;
  }
  ativos.forEach(u=>{
    const btn = document.createElement('button');
    btn.className = 'user-btn' + (u.papel==='Diretor' ? ' diretor' : '');
    btn.innerHTML = `<span class="nm">${u.nome}</span><span class="rl">${u.papel}</span>`;
    btn.onclick = ()=>{
      selectedLoginUser = u;
      loginStage = u.senhaHash ? 'senha' : 'criar';
      renderLoginScreen();
    };
    list.appendChild(btn);
  });
}

function renderLoginPasswordForm(){
  const list = document.getElementById('user-list');
  const u = selectedLoginUser;
  const criar = loginStage === 'criar';
  list.innerHTML = `
    <div style="grid-column:1/-1;">
      <button class="switch-btn" id="login-voltar" style="margin-bottom:16px;">← Escolher outro nome</button>
      <div style="font-weight:800;color:var(--navy);font-size:16px;margin-bottom:16px;">${u.nome}</div>
      ${criar ? `
        <div class="field"><label>Crie uma senha (mín. 4 caracteres)</label><input type="password" id="pw1" autocomplete="new-password"></div>
        <div class="field"><label>Confirme a senha</label><input type="password" id="pw2" autocomplete="new-password"></div>
        <div class="hint" id="pw-erro" style="color:var(--red);"></div>
        <button class="btn btn-primary" id="pw-confirmar" style="width:100%;justify-content:center;margin-top:4px;">Criar senha e entrar</button>
      ` : `
        <div class="field"><label>Senha</label><input type="password" id="pw1" autocomplete="current-password"></div>
        <div class="hint" id="pw-erro" style="color:var(--red);"></div>
        <button class="btn btn-primary" id="pw-confirmar" style="width:100%;justify-content:center;margin-top:4px;">Entrar</button>
        <div class="hint" style="margin-top:14px;">Esqueceu a senha? Peça para o Daniel redefinir seu acesso.</div>
      `}
    </div>
  `;
  document.getElementById('login-voltar').onclick = ()=>{
    loginStage='nome'; selectedLoginUser=null; renderLoginScreen();
  };
  const erro = document.getElementById('pw-erro');
  const submit = async ()=>{
    erro.textContent = '';
    if(criar){
      const p1 = document.getElementById('pw1').value;
      const p2 = document.getElementById('pw2').value;
      if(p1.length < 4){ erro.textContent = 'A senha precisa ter pelo menos 4 caracteres.'; return; }
      if(p1 !== p2){ erro.textContent = 'As senhas não coincidem.'; return; }
      const salt = gerarSalt();
      const hash = await hashSenha(p1, salt);
      await updateDoc(doc(db,'usuarios', u._id), { senhaHash:hash, senhaSalt:salt });
      login({ ...u, senhaHash:hash, senhaSalt:salt });
    } else {
      const p1 = document.getElementById('pw1').value;
      const hash = await hashSenha(p1, u.senhaSalt);
      if(hash !== u.senhaHash){ erro.textContent = 'Senha incorreta.'; return; }
      login(u);
    }
  };
  document.getElementById('pw-confirmar').onclick = submit;
  list.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  });
  list.querySelector('input').focus();
}

async function criarMatricula(nomeAluno){
  const etapas = ETAPAS.map(e=>({ id:e.id, concluida:false, concluidoPor:null, concluidoEm:null }));
  await addDoc(matriculasRef, {
    aluno: nomeAluno.trim(),
    status: "andamento",
    criadoPor: currentUser.nome,
    criadoEm: serverTimestamp(),
    finalizadoEm: null,
    etapas
  });
  showToast("Matrícula de " + nomeAluno.trim() + " iniciada");
  setView('dashboard');
}

async function concluirEtapa(mat, etapaId){
  const novasEtapas = mat.etapas.map(e=>{
    if(e.id === etapaId){
      return { ...e, concluida:true, concluidoPor: currentUser.nome, concluidoEm: new Date() };
    }
    return e;
  });
  const todasFeitas = novasEtapas.every(e=>e.concluida);
  const ref = doc(db, "matriculas", mat._id);
  await updateDoc(ref, {
    etapas: novasEtapas.map(e=>({ id:e.id, concluida:e.concluida, concluidoPor:e.concluidoPor, concluidoEm:e.concluidoEm })),
    status: todasFeitas ? "finalizada" : "andamento",
    finalizadoEm: todasFeitas ? serverTimestamp() : null
  });
  showToast(todasFeitas ? "Matrícula finalizada e enviada ao arquivo" : "Etapa concluída");
}

async function desfazerEtapa(mat, etapaId){
  const novasEtapas = mat.etapas.map(e=>
    e.id === etapaId ? { ...e, concluida:false, concluidoPor:null, concluidoEm:null } : e
  );
  const ref = doc(db, "matriculas", mat._id);
  await updateDoc(ref, {
    etapas: novasEtapas.map(e=>({ id:e.id, concluida:e.concluida, concluidoPor:e.concluidoPor, concluidoEm:e.concluidoEm })),
    status: "andamento",
    finalizadoEm: null
  });
  showToast("Etapa desmarcada");
}

async function excluirMatricula(id){
  await deleteDoc(doc(db, "matriculas", id));
  showToast("Matrícula excluída");
  setView('dashboard');
}

const q = query(matriculasRef, orderBy("criadoEm","desc"));
onSnapshot(q, snap=>{
  matriculas = snap.docs.map(d=>({ _id:d.id, ...d.data() }));
  render();
}, err=>{
  console.error(err);
  const content = document.getElementById('content');
  if(content) content.innerHTML =
    `<div class="panel"><h2>Não foi possível conectar ao banco de dados</h2>
     <p style="color:var(--slate);font-size:13.5px;">Confira se o arquivo <code>firebase-config.js</code>
     foi preenchido corretamente e se as regras do Firestore permitem acesso.
     Detalhe técnico: ${err.message}</p></div>`;
});

function render(){
  if(!currentUser) return;
  const content = document.getElementById('content');
  if(openMatriculaId){ content.innerHTML = viewDetalhe(openMatriculaId); attachDetalheEvents(); return; }
  if(currentView === 'dashboard'){ content.innerHTML = viewDashboard(); attachDashboardEvents(); return; }
  if(currentView === 'nova'){ content.innerHTML = viewNova(); attachNovaEvents(); return; }
  if(currentView === 'arquivo'){ content.innerHTML = viewArquivo(); attachArquivoEvents(); return; }
  if(currentView === 'usuarios'){ content.innerHTML = viewUsuarios(); attachUsuariosEvents(); return; }
  if(currentView === 'senha'){ content.innerHTML = viewSenha(); attachSenhaEvents(); return; }
}

function viewDashboard(){
  const ativas = matriculas.filter(m=>m.status==='andamento');
  const finalizadas = matriculas.filter(m=>m.status==='finalizada');

  const dist = ETAPAS.map(e=>({...e, count:0}));
  ativas.forEach(m=>{
    const idx = etapaAtualIndex(m);
    if(idx>=0) dist[idx].count++;
  });
  const totalDist = dist.reduce((s,d)=>s+d.count,0) + finalizadas.length;

  const banner = currentUser.nivel==='consulta'
    ? `<div class="viewonly-banner">Acesso de consulta — visualização do painel e do arquivo</div>` : '';

  return `
    ${banner}
    <div class="topline">
      <div>
        <h1>Painel de matrículas</h1>
        <p>Acompanhamento em tempo real do processo de matrícula de novos alunos</p>
      </div>
      ${currentUser.nivel!=='consulta' ? `<button class="btn btn-primary" id="btn-nova-topo">＋ Nova matrícula</button>` : ''}
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="num">${ativas.length}</div><div class="lbl">Em andamento</div></div>
      <div class="stat-card"><div class="num">${finalizadas.length}</div><div class="lbl">Finalizadas (100%)</div></div>
      <div class="stat-card"><div class="num">${matriculas.length}</div><div class="lbl">Total no sistema</div></div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <h2>Matrículas em andamento</h2>
        ${ativas.length===0 ? `<div class="empty">Nenhuma matrícula em andamento no momento.</div>` :
          ativas.map(m=>rowMatricula(m)).join('')}
      </div>

      <div class="panel">
        <h2>Distribuição por etapa</h2>
        ${totalDist===0 ? `<div class="empty">Sem dados ainda.</div>` : pieChart(dist, finalizadas.length)}
      </div>
    </div>
  `;
}

function rowMatricula(m){
  const idx = etapaAtualIndex(m);
  const doneCount = m.etapas.filter(e=>e.concluida).length;
  const pct = Math.round((doneCount/ETAPAS.length)*100);
  const etapaAtual = idx>=0 ? ETAPAS[idx].nome : null;
  const ultimoIdx = ultimoDoneIndex(m);
  const ultimaEtapa = ultimoIdx>=0 ? m.etapas[ultimoIdx] : null;
  const ultimaLinha = ultimaEtapa
    ? `Última concluída: ${ETAPAS.find(e=>e.id===ultimaEtapa.id).nome} — ${ultimaEtapa.concluidoPor}`
    : 'Nenhuma etapa concluída ainda';
  return `
    <div class="mat-row" data-id="${m._id}">
      <div class="avatar">${iniciais(m.aluno)}</div>
      <div class="info">
        <div class="name">${m.aluno}</div>
        <div class="step">${m.status==='finalizada' ? 'Processo finalizado' : 'Etapa atual: '+etapaAtual}</div>
        <div class="step">${ultimaLinha}</div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <span class="badge ${m.status==='finalizada'?'finalizada':'andamento'}">${m.status==='finalizada'?'Finalizada':doneCount+'/'+ETAPAS.length}</span>
    </div>
  `;
}

function pieChart(dist, finalizadasCount){
  const slices = dist.filter(d=>d.count>0).map((d,i)=>({label:d.nome, count:d.count, color:PIE_COLORS[d.id-1]}));
  if(finalizadasCount>0) slices.push({label:"Finalizada", count:finalizadasCount, color:"#2d9d6f"});
  const total = slices.reduce((s,x)=>s+x.count,0) || 1;
  let acc = 0;
  const r = 70, cx=90, cy=90;
  const paths = slices.map(s=>{
    const start = acc/total*2*Math.PI;
    acc += s.count;
    const end = acc/total*2*Math.PI;
    const large = (end-start) > Math.PI ? 1 : 0;
    const x1 = cx + r*Math.sin(start), y1 = cy - r*Math.cos(start);
    const x2 = cx + r*Math.sin(end), y2 = cy - r*Math.cos(end);
    return `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${s.color}" stroke="#fff" stroke-width="2"/>`;
  }).join('');
  const legend = slices.map(s=>`
    <div class="legend-item">
      <span class="legend-dot" style="background:${s.color}"></span>
      <span>${s.label}</span>
      <span class="cnt">${s.count}</span>
    </div>`).join('');
  return `
    <div style="display:flex;justify-content:center;">
      <svg width="180" height="180" viewBox="0 0 180 180">${paths}</svg>
    </div>
    <div class="legend">${legend}</div>
  `;
}

  });

// VIEW: DETALHE / CHECKLIST
// ---------------------------------------------------------------
function viewDetalhe(id){
  const mat = matriculas.find(m=>m._id===id);
  if(!mat) return `<div class="empty">Matrícula não encontrada.</div>`;
  const idx = etapaAtualIndex(mat);
  const lastDoneIndex = ultimoDoneIndex(mat);
  const podeExcluir = currentUser.excluir === true;
  const podeConcluir = currentUser.nivel !== 'consulta';

  const steps = ETAPAS.map((e,i)=>{
    const est = mat.etapas.find(x=>x.id===e.id);
    const done = est && est.concluida;
    const ready = !done && i===idx && podeConcluir;
    const podeDesfazer = done && i===lastDoneIndex && podeConcluir;
    return `
      <div class="step-row">
        <div class="step-check ${done?'done':''} ${ready?'ready':''}" data-etapa="${e.id}">${done?'✓':''}</div>
        <div class="step-body">
          <div class="step-title ${done?'done':''}">${e.nome}</div>
          <span class="step-role">${e.resp}</span>
          ${done ? `<div class="step-log">Concluído por ${est.concluidoPor} em ${fmtData(est.concluidoEm)}${podeDesfazer ? ` <button class="step-undo" data-desfazer="${e.id}">Desfazer</button>` : ''}</div>` : ''}
          ${ready ? `<div class="step-cta"><button data-etapa="${e.id}" class="btn-concluir">Marcar como concluída</button></div>` : ''}
        </div>
      </div>
    `;
  }).join('');

  return `
    <button class="btn btn-ghost" id="btn-voltar" style="margin-bottom:18px;">← Voltar</button>
    <div class="detail-header">
      <div>
        <div class="aluno-nome">${mat.aluno}</div>
        <div class="meta">Iniciada por ${mat.criadoPor} em ${fmtData(mat.criadoEm)} ${mat.status==='finalizada' ? '· Finalizada em '+fmtData(mat.finalizadoEm) : ''}</div>
      </div>
      ${podeExcluir ? `<button class="btn btn-danger" id="btn-excluir">Excluir matrícula</button>` : ''}
    </div>
    <div class="panel">
      <div class="checklist">${steps}</div>
    </div>
  `;
}
function attachDetalheEvents(){
  const back = document.getElementById('btn-voltar');
  if(back) back.onclick = ()=>{ openMatriculaId=null; render(); };

  document.querySelectorAll('.step-check.ready, .btn-concluir').forEach(el=>{
    el.onclick = ()=>{
      const mat = matriculas.find(m=>m._id===openMatriculaId);
      concluirEtapa(mat, parseInt(el.dataset.etapa,10));
    };
  });

  document.querySelectorAll('[data-desfazer]').forEach(el=>{
    el.onclick = ()=>{
      const mat = matriculas.find(m=>m._id===openMatriculaId);
      desfazerEtapa(mat, parseInt(el.dataset.desfazer,10));
    };
  });

  const del = document.getElementById('btn-excluir');
  if(del) del.onclick = ()=>{
    const mat = matriculas.find(m=>m._id===openMatriculaId);
    abrirConfirm('excluir-matricula', mat._id,
      'Excluir matrícula?',
      `A matrícula de "${mat.aluno}" será excluída permanentemente, incluindo todo o histórico de etapas. Essa ação não pode ser desfeita.`,
      'Excluir');
  };
}

    u.nivel==='consulta' ? 'Somente consulta' : 'Acesso completo',
    u.excluir ? 'Pode excluir matrículas' : null,
    u.admin ? 'Administrador' : null,
    u.senhaHash ? null : 'Sem senha definida ainda',
    u.ativo===false ? 'Inativo' : null,
  ].filter(Boolean).join(' · ');
  return `
    <div class="mat-row" style="cursor:default;">
      <div class="avatar">${iniciais(u.nome)}</div>
      <div class="info">
        <div class="name">${u.nome}</div>
        <div class="step">${detalhes}</div>
      </div>
      <div class="user-row-actions">
        <button class="btn btn-ghost" data-edit="${u._id}">Editar</button>
        <button class="btn btn-ghost" data-reset="${u._id}">Redefinir senha</button>
        <button class="btn btn-danger" data-del="${u._id}">Excluir</button>
      </div>
    </div>
  `;
}

function attachUsuariosEvents(){
  const addBtn = document.getElementById('btn-add-usuario');
  if(addBtn) addBtn.onclick = ()=>{ addingUser=true; editingUserId=null; render(); };

  const novoCancelar = document.getElementById('novo-cancelar');
  if(novoCancelar) novoCancelar.onclick = ()=>{ addingUser=false; render(); };

  const novoSalvar = document.getElementById('novo-salvar');
  if(novoSalvar) novoSalvar.onclick = async ()=>{
    const nome = document.getElementById('novo-nome').value.trim();
    const papel = document.getElementById('novo-papel').value.trim() || 'Equipe';
    if(nome.length < 2){ showToast('Digite o nome da pessoa'); return; }
    if(USERS.some(u=>u.nome.toLowerCase()===nome.toLowerCase())){ showToast('Já existe um usuário com esse nome'); return; }
    const nivel = document.getElementById('novo-nivel').value;
    const excluir = document.getElementById('novo-excluir').checked;
    const admin = document.getElementById('novo-admin').checked;
    await addDoc(usuariosRef, { nome, papel, nivel, excluir, admin, ativo:true, senhaHash:null, senhaSalt:null });
    addingUser = false;
    showToast('Usuário adicionado — ele(a) cria a senha no primeiro acesso');
  };

  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.onclick = ()=>{ editingUserId = el.dataset.edit; addingUser=false; render(); };
  });
  const cancelarEdit = document.getElementById('edit-cancelar');
  if(cancelarEdit) cancelarEdit.onclick = ()=>{ editingUserId=null; render(); };

  document.querySelectorAll('[data-save]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.dataset.save;
      const nome = document.getElementById('edit-nome').value.trim();
      const papel = document.getElementById('edit-papel').value.trim();
      if(nome.length < 2){ showToast('Digite o nome da pessoa'); return; }
      const nivel = document.getElementById('edit-nivel').value;
      const excluir = document.getElementById('edit-excluir').checked;
      const admin = document.getElementById('edit-admin').checked;
      await updateDoc(doc(db,'usuarios', id), { nome, papel, nivel, excluir, admin });
      editingUserId = null;
      showToast('Usuário atualizado');
    };
  });

  document.querySelectorAll('[data-reset]').forEach(el=>{
    el.onclick = ()=>{
      const u = USERS.find(x=>x._id===el.dataset.reset);
      abrirConfirm('resetar-senha', u._id,
        'Redefinir senha?',
        `"${u.nome}" vai precisar criar uma nova senha no próximo acesso. A senha atual deixará de funcionar imediatamente.`,
        'Redefinir');
    };
  });

  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = ()=>{
      const u = USERS.find(x=>x._id===el.dataset.del);
      if(u._id === currentUser._id){ showToast('Você não pode excluir o próprio usuário'); return; }
      abrirConfirm('excluir-usuario', u._id,
        'Excluir usuário?',
        `"${u.nome}" perderá o acesso ao sistema. Essa ação não pode ser desfeita.`,
        'Excluir');
    };
  });
}

// ---------------------------------------------------------------
// MODAL DE CONFIRMAÇÃO (genérico)
// ---------------------------------------------------------------
function abrirConfirm(tipo, id, titulo, texto, botaoTexto){
  pendingAction = { tipo, id };
  document.getElementById('modal-title').textContent = titulo;
  document.getElementById('modal-text').textContent = texto;
  document.getElementById('modal-confirm').textContent = botaoTexto || 'Confirmar';
  document.getElementById('modal-bg').classList.add('show');
}
document.getElementById('modal-cancel').onclick = ()=>{
  document.getElementById('modal-bg').classList.remove('show');
  pendingAction = null;
};
document.getElementById('modal-confirm').onclick = async ()=>{
  if(pendingAction){
    if(pendingAction.tipo === 'excluir-matricula') await excluirMatricula(pendingAction.id);
    if(pendingAction.tipo === 'excluir-usuario') await excluirUsuario(pendingAction.id);
    if(pendingAction.tipo === 'resetar-senha') await resetarSenhaUsuario(pendingAction.id);
  }
  document.getElementById('modal-bg').classList.remove('show');
  pendingAction = null;
};

// INÍCIO
// ---------------------------------------------------------------
renderLoginScreen();
seedUsuariosSeNecessario();
